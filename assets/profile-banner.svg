    <text x="88" y="170" font-size="22" letter-spacing="2" fill="#D4BCC8">frontend developer  ·  visual thinker</text>
  </g>
  <g fill="#D4BCC8" opacity=".9">
    <path d="M1010 95 l8 20 22 1-17 14 6 22-19-12-19 12 6-22-17-14 22-1z"/>
    <path d="M1110 155 l6 15 17 1-13 10 5 17-15-9-15 9 5-17-13-10 17-1z"/>
    <circle cx="1027" cy="212" r="5"/><circle cx="1146" cy="78" r="4"/>
